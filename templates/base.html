<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Management System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Library Management System</h1>
    <span>MITS-DU Gwalior | Skills Development Micro Project</span>
  </header>
  <nav>
    <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Dashboard</a>
    <a href="{{ url_for('books') }}" class="{{ 'active' if request.endpoint in ('books', 'edit_book') }}">Books</a>
    <a href="{{ url_for('members') }}" class="{{ 'active' if request.endpoint == 'members' }}">Members</a>
    <a href="{{ url_for('issue_page') }}" class="{{ 'active' if request.endpoint == 'issue_page' }}">Issue / Return</a>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
